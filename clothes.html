// Render categories
let catHtml = "";
for(let cat in categories){
    const firstImg = categories[cat][0]?.img || placeholderImg;
    catHtml += `<div class="card" onclick="openProducts('${cat}')">
        <img src="${firstImg}">
        <h3>${cat}</h3>
    </div>`;
}
document.getElementById("categoryGrid").innerHTML = catHtml;

// Show products
function openProducts(category){
    document.getElementById("productSection").style.display = "block";
    document.getElementById("categorySection").style.display = "none";
    document.getElementById("productTitle").innerText = category;

    let html = "";
    categories[category].forEach((p, i) => {
        html += `<div class="card">
            <img src="${p.img || placeholderImg}">
            <h4>${p.name}</h4>
            <p>${p.gender}</p>
            <p>₹${p.price} | ${p.offer || ''}</p>
            <p>${p.description || ''}</p>
            <button class="btn" onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
            <button class="btn" onclick="buyNow('${category}', ${i})">Buy Now</button>
        </div>`;
    });

    document.getElementById("productGrid").innerHTML = html;
}

function backToCategories(){
    document.getElementById("productSection").style.display = "none";
    document.getElementById("categorySection").style.display = "block";
}
function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // Check if product is already in cart
    const existing = cart.find(item => item.name === product.name);
    if(existing){
        existing.quantity = (existing.quantity || 1) + 1; // increment quantity
    } else {
        let productForCart = {
            name: product.name,
            price: product.price,
            img: product.img || 'https://via.placeholder.com/70',
            selectedSize: product.selectedSize || '',
            quantity: 1
        };
        cart.push(productForCart);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    alert(`🛒 ${product.name} added to cart successfully!`);
    updateCartCount(); // update cart counter
}


function buyNow(category, index) {
    if (!categories[category] || !categories[category][index]) {
        alert("Product not found!");
        return;
    }

    const p = categories[category][index];
    const popup = document.getElementById("popup");
    const popupContent = document.getElementById("popupContent");

    // Show popup
    popup.style.display = "flex";

    // Fill popup content
    popupContent.innerHTML = `
        <h2 style="text-align:center; margin-bottom:20px;">${p.name}</h2>

        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom:20px;
        ">
            <img src="${p.img || placeholderImg}" 
                 style="
                     width:250px;
                     height:auto;
                     border-radius:12px;
                     box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                     transition: transform 0.3s;
                 "
                 onmouseover="this.style.transform='scale(1.05)'"
                 onmouseout="this.style.transform='scale(1)'"
            >
        </div>

        <p><b>Price:</b> ₹${p.price} | ${p.offer || ''}</p>
        <p>${p.description || ''}</p>
        <p><b>${p.delivery || ''}</b></p>

        <label>Select Size:</label>
        <select id="sizeSelect">${(p.sizeList || []).map(s => `<option>${s}</option>`).join("")}</select>

        <label>Payment Method:</label>
        <select id="paymentSelect">
            <option>UPI</option>
            <option>Cash on Delivery</option>
            <option>Debit / Credit Card</option>
            <option>Net Banking</option>
        </select>

        <div id="addressBox" style="display:block; margin-top:10px;">
            Enter Delivery Address:
            <input type="text" id="addressInput" placeholder="Full Address" style="width:90%;">
        </div>

        <button class="btn" onclick="confirmOrder('${p.name}', '${p.delivery}')">Confirm Order</button>
        <button class="btn back-btn" onclick="closePopup()">Close</button>
    `;

    // Make popup scrollable
    popupContent.style.cssText = `
        max-height: 70vh;
        overflow-y: auto;
        padding: 20px;
    `;
}

// Close popup function
function closePopup() {
    document.getElementById("popup").style.display = "none";
}

// Confirm order function
function confirmOrder(productName, deliveryInfo) {
    const sizeEl = document.getElementById("sizeSelect");
    const paymentEl = document.getElementById("paymentSelect");
    const addressEl = document.getElementById("addressInput");

    const size = sizeEl ? sizeEl.value : "N/A";
    const payment = paymentEl ? paymentEl.value : "N/A";
    const address = addressEl ? addressEl.value.trim() : "";

    // Ensure address is entered
    if (!address) {
        alert("Please enter delivery address!");
        return;
    }

    let message = `Order Confirmed!\n\nProduct: ${productName}\nSize: ${size}\nPayment: ${payment}\nAddress: ${address}\nDelivery Info: ${deliveryInfo || "N/A"}`;

    // Show alert
    alert(message);

    // Automatically close popup after confirmation
    closePopup();
}
