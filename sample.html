  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffeef5;
    }

    /* Navbar */
    nav {
      background: #ffd1e8;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-size: 26px;
      font-weight: bold;
      color: #ff4d94;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 16px;
    }

    nav ul li a:hover {
      color: #ff4d94;
    }

    /* Header */
    .header {
      background: #ff4d94;
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
    }

    /* Category Section */
    .section-title {
      text-align: center;
      margin: 30px 0 10px;
      font-size: 24px;
      font-weight: bold;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .category-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: 0.3s;
      border: 2px solid #ffd1e8;
    }

    .category-card:hover {
      transform: translateY(-5px);
      border: 2px solid #ff4d94;
    }

    .category-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
    }

    .category-card h3 {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #ffd1e8;
      font-weight: bold;
    }
  </style>
</head>
